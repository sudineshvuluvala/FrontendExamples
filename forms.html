<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color:lemonchiffon;">
    <center><h1>Student Registration Form</h1></center>
    <center>
    <table>
        <form>
        <tr>
            <td><b>Roll.No:</b></td>
            <td><input type="text" placeholder="Enter Your Roll number"></td>
        </tr>
        <tr>
            <td><b>Student Name:</b></td>
            <td>
                <input type="text" placeholder="First Name">-<input type="text" placeholder="Last Name">
            </td>
        </tr>
        <tr>
            <td><b>Father Name:</b></td>
            <td><input type="text" placeholder="Enter your Father Name"></td>
        </tr>
        <tr>
            <td><b>Date of Birth:</b></td>
            <td><input type="date"></td>
        </tr>
        <tr>
            <td><b>Mobile Number:</b></td>
            <td><input type="text" placeholder="+91"></td>
        </tr>
        <tr>
            <td><b>Email</b></td>
            <td><input type="email" placeholder="Enter Your Email"></td>
        </tr>
        <tr>
            <td><b>Password</b></td>
            <td><input type="password" placeholder="Enter your password"></td>
        </tr>
        <tr>
            <td><b>Gender</b></td>
            <td><input type="radio" id="a" name="Gender"><label for="a">Male</label>  <input type="radio" id="b" name="Gender"><label for="b">Female</label></td>
        </tr>
        <tr>
            <td><b>Department</b></td>
            <td><input type="radio">CSE <input type="radio">IT <input type="radio">ECE <input type="radio">Civil <input type="radio">Mech</td>
        </tr>
        <tr>
            <td><b>Course</b></td>
            <td><select>
                <option>------Select Current Course------</option>
                <option>Python Full Stack</option>
                <option>Java Full Stack</option>
                <option>Data analysis</option>
            </select></td>
        </tr>
        <tr>
            <td><b>Student Photo</b></td>
            <td><input type="file"></td>
        </tr>
        <tr>
            <td><b>City:</b></td>
            <td><input type="text" placeholder="Enter your City"></td>
        </tr>
        <tr>
            <td><b>Address:</b></td>
            <td><textarea rows="5" cols="30" placeholder="Enter your Address"></textarea></td>
        </tr>
        <tr><td colspan="2"><center><input type="submit"></center></td></tr>
    </form>
    </table>
    </center>
</body>
</html>
